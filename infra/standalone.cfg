# Standalone xrpld for the carbs demo (FIANSO-SPEC 6.12, task N9).
# Run: xrpld --conf infra/standalone.cfg -a --start
# Ledgers close only when infra/closer.ts calls ledger_accept on the admin port.

[server]
port_ws_public
port_ws_admin_local
port_rpc_admin_local

# Public WebSocket for the web app and wallets (no admin rights).
# 0.0.0.0 inside the container; the host publishes it on 127.0.0.1 only.
[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

# Admin WebSocket for the closer only.
[port_ws_admin_local]
port = 6007
ip = 0.0.0.0
admin = 127.0.0.1, 172.16.0.0/12
protocol = ws

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[node_size]
small

[node_db]
type = NuDB
path = /var/lib/xrpld/db/nudb
online_delete = 2048
advisory_delete = 0

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/lib/xrpld/debug.log

[ssl_verify]
0

